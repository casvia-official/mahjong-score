<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻雀 点数管理</title>
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#2c3e50">
<style>
  html, body{ height:100%; }
  body{
    margin:0; display:flex; align-items:flex-end; justify-content:center;
    font-family:"Yu Gothic","Meiryo",sans-serif;
    background-image:url('icons/icon-512.png');
    background-size:cover;
    background-position:center;
  }
  a.openBtn{
    display:inline-block; margin-bottom:8vh; padding:14px 36px; background:#2980b9; color:#fff;
    text-decoration:none; border-radius:8px; font-weight:bold; font-size:18px;
    box-shadow:0 4px 16px rgba(0,0,0,0.35);
  }
</style>
</head>
<body>
  <a class="openBtn" href="./麻雀点数管理.html">アプリを開く</a>
  <script>
    if("serviceWorker" in navigator){
      window.addEventListener("load", ()=>{
        navigator.serviceWorker.register("./sw.js").catch(()=>{});
      });
    }
  </script>
</body>
</html>
